# NIRUSETTINGS schema (format 1): NIRUWM, the window manager.
# Written from niruwm src/config.rs (Config, validate) and config.example.toml
# (NIRUWM 0.37.15).
# NIRUWM and NIRUBAR read this file and refuse keys they do not know, so
# only keys both accept are listed. `niruwm --check-config` and
# `nirubar --check-config` check every candidate before it is written.
format = 1
component = "niruwm"
name = "NIRUWM"
file = "niruwm/config.toml"
binary = "niruwm"
check = [["niruwm", "--check-config"], ["nirubar", "--check-config"]]
check_links = ["nirubar"]
apply = "reload"

[modes.reload]
run = ["niructl", "reload"]
says = "applied live (niructl reload)"
live = true

[modes.watch]
says = "applied live: NIRUWM rereads the file within seconds"
live = true

[modes.login]
says = "takes effect at the next login"

[modes.power]
says = "takes effect at the next plug or unplug, or now with niructl powerprofile auto"

[modes.studio]
says = "takes effect the next time studio mode turns on"

[modes.hibernate]
says = "takes effect at the next NIRUX update, or now with nirux hibernate apply"

# ── Appearance ──────────────────────────────────────────────────────────────

[[setting]]
key = "theme"
type = "enum"
choices_from = "themes"
pattern = "theme"
default = "niru-noir"
section = "Appearance"
group = "Theme"
label = "NIRUX theme"
help = "The colours of the whole desktop: window manager, bar, launcher and every NIRU program."

[[setting]]
key = "font_size"
type = "float"
min = 8.0
max = 40.0
step = 0.5
unit = "pt"
default = 15.0
section = "Appearance"
group = "Font"
label = "Font size"
help = "Size of the bar and window manager text, in points (8 to 40)."

[[setting]]
key = "font_path"
type = "path"
optional = true
section = "Appearance"
group = "Font"
label = "Font file"
help = "A monospace .ttf or .otf file. Empty uses JetBrains Mono Nerd Font or DejaVu Sans Mono."

[[setting]]
key = "wallpaper.enabled"
type = "bool"
default = false
section = "Appearance"
group = "Wallpaper"
label = "NIRUWM sets the wallpaper"
help = "Off when another program owns the background. NIRUX turns it on."

[[setting]]
key = "wallpaper.follow_theme"
type = "bool"
default = true
section = "Appearance"
group = "Wallpaper"
label = "Follow the theme"
help = "A theme change shows that theme's own wallpaper from the theme folder."

[[setting]]
key = "wallpaper.theme_style"
type = "enum"
choices = [
  { value = "art", label = "art", help = "each theme's own artwork" },
  { value = "signature", label = "signature", help = "the NIRUX Signature picture in the theme's colours" },
]
default = "art"
section = "Appearance"
group = "Wallpaper"
label = "Theme picture"
help = "art: each theme's artwork. signature: the NIRUX Signature picture (nirux wallpapers signature)."

[[setting]]
key = "wallpaper.mode"
type = "enum"
choices = [
  { value = "random", help = "a new picture at each rotation" },
  { value = "fixed", help = "one picture, chosen once and kept" },
  { value = "single", help = "always the file below" },
]
default = "random"
section = "Appearance"
group = "Wallpaper"
label = "Mode"
help = "random: a new picture at each rotation. fixed: one picture, kept. single: always the file below."

[[setting]]
key = "wallpaper.dir"
type = "path"
pattern = "nonempty"
default = "~/Pictures/Wallpapers"
section = "Appearance"
group = "Wallpaper"
label = "Picture folder"
help = "Where pictures are picked from (jpg, png, webp, bmp)."

[[setting]]
key = "wallpaper.file"
type = "path"
default = ""
section = "Appearance"
group = "Wallpaper"
label = "Single picture"
help = "The picture shown in single mode. Your own single picture is never replaced by the theme."

[[setting]]
key = "wallpaper.rotation_minutes"
type = "int"
min = 0
max = 100000
step = 5
unit = "min"
default = 10
section = "Appearance"
group = "Wallpaper"
label = "Change every"
help = "Minutes between pictures. 0 never changes it."

[[setting]]
key = "wallpaper.scale"
type = "enum"
choices = [
  { value = "smart", help = "crop when the shapes are close, else the whole picture over a blurred copy" },
  { value = "fill", help = "crop to fill the screen" },
  { value = "fit", help = "the whole picture, letterboxed" },
  { value = "stretch", help = "stretched to the screen" },
  { value = "center", help = "unscaled, centred" },
]
default = "smart"
section = "Appearance"
group = "Wallpaper"
label = "Scaling"
help = "How a picture fills each screen. smart is right on any screen, ultrawide and portrait too."

[[setting]]
key = "wallpaper.shuffle_on_start"
type = "bool"
default = true
section = "Appearance"
group = "Wallpaper"
label = "New picture at login"
help = "Pick a fresh picture at every login, even in fixed mode."

[[setting]]
key = "wallpaper.theme_dir"
type = "path"
pattern = "nonempty"
default = "~/Pictures/Wallpapers/NIRU"
section = "Appearance"
group = "Wallpaper"
label = "Theme wallpaper folder"
help = "Where NIRUX installs the theme wallpapers (nirux-wallpaper-THEME-4k.png)."

# ── Window manager ──────────────────────────────────────────────────────────

[[setting]]
key = "gap"
type = "int"
min = 0
max = 100
unit = "px"
default = 8
section = "Window manager"
group = "Layout"
label = "Gap between windows"
help = "Space between tiled windows, in pixels (0 to 100). Super+G toggles gaps."

[[setting]]
key = "smart_gaps"
type = "bool"
default = true
section = "Window manager"
group = "Layout"
label = "Smart gaps"
help = "One tiled window (or monocle) fills the screen without gap or border."

[[setting]]
key = "border_width"
type = "int"
min = 0
max = 20
unit = "px"
default = 2
section = "Window manager"
group = "Layout"
label = "Border width"
help = "Border around each window, in pixels (0 to 20). 0 draws no borders."

[[setting]]
key = "master_ratio"
type = "float"
min = 0.1
max = 0.9
step = 0.05
default = 0.55
section = "Window manager"
group = "Layout"
label = "Master share"
help = "Default share of the screen width for the master column. Super+H/L change it per workspace."

[[setting]]
key = "monitors.workspaces"
type = "int"
min = 1
max = 32
default = 10
section = "Window manager"
group = "Layout"
label = "Workspaces per screen"
help = "How many workspaces each screen has (1 to 32), unless a monitor profile says otherwise."

[[setting]]
key = "monitors.layouts"
type = "list"
item = "enum"
choices = ["tile", "left", "monocle", "centered", "centeredfloat", "fibonacci", "floating", "scroll"]
max_items = 32
default = []
section = "Window manager"
group = "Layout"
label = "Start layouts"
help = "The layout each workspace starts with, in workspace order (tile, left, monocle, centered, centeredfloat, fibonacci, floating, scroll). Empty tiles every workspace. NIRUWM saves your changes here."

[[setting]]
key = "swallow.enabled"
type = "bool"
default = true
section = "Window manager"
group = "Windows and focus"
label = "Window swallowing"
help = "A program started from a terminal (mpv, zathura, feh) takes the terminal's place until it closes."

[[setting]]
key = "scratchpad.command"
no_reset = true
type = "list"
split = "words"
min_items = 1
default = ["kitty", "--class", "scratchpad"]
section = "Window manager"
group = "Scratchpads"
label = "Default scratchpad program"
help = "Super+Shift+S. An argument list that gives its window a class (--class, -class, --name or --app-id); NIRUWM refuses one without."

[[setting]]
key = "scratchpad.hide_on_focus_loss"
type = "bool"
default = false
section = "Window manager"
group = "Scratchpads"
label = "Hide on focus loss"
help = "Hide a shown scratchpad as soon as another window gets the focus. Off: it stays until its key hides it."

[[setting]]
key = "scratchpad.width"
type = "float"
min = 0.1
max = 0.95
step = 0.05
default = 0.6
section = "Window manager"
group = "Scratchpads"
label = "Default scratchpad width"
help = "Share of the screen width (0.1 to 0.95) of the default scratchpad, Super+Shift+S."

[[setting]]
key = "scratchpad.height"
type = "float"
min = 0.1
max = 0.95
step = 0.05
default = 0.6
section = "Window manager"
group = "Scratchpads"
label = "Default scratchpad height"
help = "Share of the screen height (0.1 to 0.95) of the default scratchpad."

[[setting]]
key = "restore_session"
type = "bool"
default = false
apply = "login"
section = "Window manager"
group = "Windows and focus"
label = "Restore the last session"
help = "At login, start the programs that were open when the last session ended (Super+Shift+W saves)."

[[setting]]
key = "pip.size"
type = "int"
min = 10
max = 60
unit = "%"
default = 25
section = "Window manager"
group = "Picture in picture"
label = "Size"
help = "Width of a picture-in-picture window as a percentage of the screen (10 to 60). Super+Alt+P."

[[setting]]
key = "pip.corner"
type = "enum"
choices = ["bottom-right", "bottom-left", "top-right", "top-left"]
default = "bottom-right"
section = "Window manager"
group = "Picture in picture"
label = "Corner"
help = "Where a picture-in-picture window goes. Super+Ctrl+P moves it to the next corner."

[[setting]]
key = "pip.auto"
type = "bool"
default = true
section = "Window manager"
group = "Picture in picture"
label = "Browser PiP windows"
help = "A browser's own picture-in-picture window (YouTube's PiP button) goes to the corner by itself."

[[setting]]
key = "terminal"
no_reset = true
type = "list"
split = "words"
min_items = 1
default = ["kitty"]
section = "Window manager"
group = "Programs"
label = "Terminal"
help = "Super+Enter. An argument list, never run by a shell."

[[setting]]
key = "terminal_alt"
no_reset = true
type = "list"
split = "words"
default = []
section = "Window manager"
group = "Programs"
label = "Second terminal"
help = "Super+Shift+Enter. Empty uses the terminal above."

[[setting]]
key = "browser"
no_reset = true
type = "list"
split = "words"
default = ["brave"]
section = "Window manager"
group = "Programs"
label = "Browser"
help = "Super+B. An argument list, never run by a shell."

[[setting]]
key = "launcher"
no_reset = true
type = "list"
split = "words"
min_items = 1
default = ["nirulauncher", "--apps"]
section = "Window manager"
group = "Programs"
label = "Launcher"
help = "Super+P. An argument list, never run by a shell."

[[setting]]
key = "nightlight.mode"
type = "enum"
choices = [
  { value = "gradual", help = "from sunset glide to the night temperature, back by sunrise" },
  { value = "solar", help = "follow the sun between day and night temperature" },
  { value = "fixed", help = "night temperature from the on to the off time" },
  { value = "manual", help = "only Super+N and niructl nightlight" },
]
default = "gradual"
apply = "watch"
section = "Window manager"
group = "Night light"
label = "Mode"
help = "gradual from sunset, solar with the sun, fixed between two times, or manual (Super+N only)."

[[setting]]
key = "nightlight.temperature"
type = "int"
min = 1000
max = 10000
step = 100
unit = "K"
default = 3500
apply = "watch"
section = "Window manager"
group = "Night light"
label = "Night temperature"
help = "Kelvin at night (1000 to 10000), also what Super+N turns on."

[[setting]]
key = "nightlight.day_temperature"
type = "int"
min = 1000
max = 10000
step = 100
unit = "K"
default = 6500
apply = "watch"
section = "Window manager"
group = "Night light"
label = "Day temperature"
help = "Kelvin by day in solar and gradual mode. 6500 is neutral."

[[setting]]
key = "nightlight.start_temperature"
type = "int"
min = 1000
max = 10000
step = 100
unit = "K"
default = 5500
apply = "watch"
section = "Window manager"
group = "Night light"
label = "Evening start temperature"
help = "Gradual mode: the Kelvin it starts from in the evening."

[[setting]]
key = "nightlight.not_before"
type = "string"
pattern = "hhmm"
default = "19:00"
apply = "watch"
section = "Window manager"
group = "Night light"
label = "Not before"
help = "Gradual mode: the evening never starts before this time (HH:MM)."

[[setting]]
key = "nightlight.deepest_at"
type = "string"
pattern = "hhmm"
default = "22:00"
apply = "watch"
section = "Window manager"
group = "Night light"
label = "Warmest at"
help = "Gradual mode: the night temperature is reached here, or an hour after the start if later."

[[setting]]
key = "nightlight.on"
type = "string"
pattern = "hhmm"
default = "20:00"
apply = "watch"
section = "Window manager"
group = "Night light"
label = "On at"
help = "Fixed mode: switch on at this time (HH:MM)."

[[setting]]
key = "nightlight.off"
type = "string"
pattern = "hhmm"
default = "07:00"
apply = "watch"
section = "Window manager"
group = "Night light"
label = "Off at"
help = "Fixed mode: switch off. Gradual mode: the night is over by this time."

[[setting]]
key = "nightlight.latitude"
type = "float"
min = -90.0
max = 90.0
step = 0.01
default = 0.0
apply = "watch"
section = "Window manager"
group = "Night light"
label = "Latitude"
help = "Degrees, north positive. 0 and 0 mean no location (Stockholm is used)."

[[setting]]
key = "nightlight.longitude"
type = "float"
min = -180.0
max = 180.0
step = 0.01
default = 0.0
apply = "watch"
section = "Window manager"
group = "Night light"
label = "Longitude"
help = "Degrees, east positive."

[[setting]]
key = "brightness.step"
type = "int"
min = 1
max = 50
unit = "%"
default = 5
section = "Window manager"
group = "Brightness"
label = "Brightness step"
help = "Percent per brightness key press (1 to 50)."

[[setting]]
key = "brightness.device"
type = "string"
default = ""
section = "Window manager"
group = "Brightness"
label = "Brightness device"
help = "A brightnessctl device name or wildcard (intel_backlight). Empty uses brightnessctl's default device."

[[setting]]
key = "swallow.terminals"
type = "list"
split = "comma"
default = []
section = "Window manager"
group = "Windows and focus"
label = "Swallowing terminals"
help = "Window classes that count as terminals, comma separated (kitty, Alacritty). Empty uses the built-in list of common terminals; a list replaces it."

[[setting]]
key = "swallow.exclude"
type = "list"
split = "comma"
default = []
section = "Window manager"
group = "Windows and focus"
label = "Never swallow"
help = "Window classes that never take a terminal's place, comma separated. Empty uses the built-in list (browsers, NIRU overlays, xev); a list replaces it."

[[setting]]
key = "autostart.enabled"
type = "bool"
default = true
apply = "login"
section = "Window manager"
group = "Autostart"
label = "Autostart"
help = "Open the [[autostart.apps]] programs at login, grouped by workspace. NIRUX's file turns it off; empty apps start nothing."

[[setting]]
key = "autostart.settle_seconds"
type = "int"
min = 0
max = 60
unit = "s"
default = 2
apply = "login"
section = "Window manager"
group = "Autostart"
label = "Pause between workspaces"
help = "Seconds autostart waits after each workspace group before the next one (0 to 60)."

[[setting]]
key = "autostart.window_timeout_ms"
type = "int"
min = 500
max = 30000
step = 500
unit = "ms"
default = 5000
apply = "login"
section = "Window manager"
group = "Autostart"
label = "Wait for a window"
help = "How long autostart waits for an app's window when the app names a class (500 to 30000 ms)."

[[setting]]
key = "autostart.return_workspace"
type = "int"
min = 0
max = 10
default = 1
apply = "login"
section = "Window manager"
group = "Autostart"
label = "Return to workspace"
help = "Where autostart ends (1 to 10). 0 stays on the last workspace it used."

[[setting]]
key = "studio.idle"
type = "bool"
default = true
apply = "studio"
section = "Window manager"
group = "Studio mode"
label = "Pause the screensaver"
help = "While studio mode (niructl studio) is on, the screensaver, idle lock and display-off wait."

[[setting]]
key = "studio.dnd"
type = "bool"
default = true
apply = "studio"
section = "Window manager"
group = "Studio mode"
label = "Do Not Disturb"
help = "No notification popups or sounds while studio mode is on."

[[setting]]
key = "studio.compositor"
type = "bool"
default = true
apply = "studio"
section = "Window manager"
group = "Studio mode"
label = "Stop the compositor"
help = "Stop picom while studio mode is on and start it again afterwards."

[[setting]]
key = "studio.power_profile"
type = "enum"
choices = [
  { value = "performance", help = "the fastest profile" },
  { value = "balanced", help = "the usual profile" },
  { value = "power-saver", help = "the slowest, longest lasting profile" },
  { value = "keep", help = "leave the power profile alone" },
  { value = "", label = "keep (empty)", help = "an empty value, the same as keep" },
]
default = "performance"
apply = "studio"
section = "Window manager"
group = "Studio mode"
label = "Power profile"
help = "The power-profiles-daemon profile while studio mode is on; keep leaves it alone."

[[setting]]
key = "studio.auto_enable"
type = "bool"
default = false
section = "Window manager"
group = "Studio mode"
label = "Turn on with a DAW"
help = "Studio mode turns on when a DAW window appears and off again when the last one closes."

[[setting]]
key = "studio.daw_classes"
type = "list"
split = "comma"
default = ["REAPER"]
section = "Window manager"
group = "Studio mode"
label = "DAW windows"
help = "Window classes that count as a DAW, comma separated (REAPER, Bitwig Studio). Empty: no window turns studio mode on."

[[setting]]
key = "battery.charge_limit"
type = "int"
min = 50
max = 100
step = 5
unit = "%"
default = 80
apply = "login"
section = "Window manager"
group = "Battery and power"
label = "Charge limit"
help = "Stop charging at this percentage (50 to 100, 100 means no limit). Needs firmware support; niructl battery apply sets it now."

[[setting]]
key = "battery.auto_profile"
type = "bool"
default = true
apply = "login"
section = "Window manager"
group = "Battery and power"
label = "Profile follows the power source"
help = "One power profile on battery, another on AC, switched when you plug in or unplug. Studio mode wins while it is on."

[[setting]]
key = "battery.profile_on_battery"
type = "enum"
choices = [
  { value = "power-saver", help = "the slowest, longest lasting profile" },
  { value = "balanced", help = "the usual profile" },
  { value = "performance", help = "the fastest profile" },
  { value = "keep", help = "leave the power profile alone" },
  { value = "", label = "keep (empty)", help = "an empty value, the same as keep" },
]
default = "power-saver"
apply = "power"
section = "Window manager"
group = "Battery and power"
label = "Profile on battery"
help = "The power profile while the laptop runs on battery; keep leaves it alone."

[[setting]]
key = "battery.profile_on_ac"
type = "enum"
choices = [
  { value = "balanced", help = "the usual profile" },
  { value = "performance", help = "the fastest profile" },
  { value = "power-saver", help = "the slowest, longest lasting profile" },
  { value = "keep", help = "leave the power profile alone" },
  { value = "", label = "keep (empty)", help = "an empty value, the same as keep" },
]
default = "balanced"
apply = "power"
section = "Window manager"
group = "Battery and power"
label = "Profile on AC"
help = "The power profile while the laptop is plugged in; keep leaves it alone."

[[setting]]
key = "battery.hibernate_after_minutes"
type = "int"
min = 0
max = 10080
step = 30
unit = "min"
default = 120
since = "0.35"
apply = "hibernate"
section = "Window manager"
group = "Battery and power"
label = "Hibernate after sleeping"
help = "With NIRUSLEEP on (nirux hibernate on): minutes of sleep before the laptop saves to disk and switches off (0 to 10080). 0 keeps plain sleep."

# ── Lists of tables ─────────────────────────────────────────────────────────
# Edited one entry at a time in a form; the whole list is checked by the
# schema and by `niruwm --check-config` before it is written.

[[table]]
key = "scratchpad.slot"
label = "Numbered scratchpads"
help = "Super+Alt+1 to 9 shows or hides a slot; Super+Alt+Shift+1 to 9 sends the focused window there, or back. A slot with a program starts it the first time."
section = "Window manager"
group = "Scratchpads"
item = "slot"
id_field = "number"
slots = [1, 9]
max_items = 9
editor = "scratchpad"

[[table.field]]
key = "number"
type = "int"
min = 1
max = 9
required = true
read_only = true
label = "Slot"
help = "The digit in Super+Alt+N."

[[table.field]]
key = "command"
type = "list"
split = "words"
program = "command"
label = "Program"
help = "Started the first time the slot is opened, as an argument list. It must give its window a class of its own (--class NAME). Empty: the slot only holds windows sent to it."

[[table.field]]
key = "width"
type = "float"
min = 0.1
max = 0.95
step = 0.05
label = "Width"
help = "Share of the screen width (0.1 to 0.95). Unset: the default scratchpad's width."

[[table.field]]
key = "height"
type = "float"
min = 0.1
max = 0.95
step = 0.05
label = "Height"
help = "Share of the screen height (0.1 to 0.95). Unset: the default scratchpad's height."

[[table]]
key = "autostart.apps"
label = "Programs at login"
help = "Started one after the other at login, each on its workspace, when Autostart is on. With a class, autostart waits for the program's window before the next one."
section = "Window manager"
group = "Autostart"
item = "program"
ordered = true
apply = "login"
editor = "autostart"

[[table.field]]
key = "workspace"
type = "int"
min = 1
max = 10
default = 1
required = true
label = "Workspace"
help = "The workspace the program opens on (1 to 10)."

[[table.field]]
key = "command"
type = "list"
split = "words"
min_items = 1
required = true
program = "command"
label = "Program"
help = "The program and its arguments, an argument list (never run by a shell)."

[[table.field]]
key = "class"
type = "string"
program = "class"
label = "Window class"
help = "Part of the window's class (WM_CLASS). Autostart waits for that window before it starts the next program; empty keeps the old fixed pause."

[[table]]
key = "rules"
label = "Window rules"
help = "What happens to a window when it first opens, by its class. The first rule that matches wins, so the order matters."
section = "Window manager"
group = "Window rules"
item = "rule"
ordered = true
editor = "rules"

[[table.field]]
key = "class"
type = "string"
pattern = "nonempty"
required = true
program = "class"
label = "Window class"
help = "Matched against the window's class and instance (WM_CLASS); part of it is enough, upper and lower case count."

[[table.field]]
key = "workspace"
type = "int"
min = 0
max = 31
offset = 1
label = "Workspace"
help = "The workspace it opens on (1 to 32). Unset: the current one. The file counts from 0; NIRUSETTINGS writes the right number."

[[table.field]]
key = "floating"
type = "bool"
label = "Floating"
help = "Opens floating instead of tiled."

[[table.field]]
key = "center"
type = "bool"
label = "Centred"
help = "A floating window opens in the middle of its screen."

[[table.field]]
key = "sticky"
type = "bool"
label = "On every workspace"
help = "A floating window stays visible on every workspace of its screen."

[[table.field]]
key = "opacity"
type = "int"
min = 1
max = 100
step = 5
unit = "%"
label = "Opacity"
