# The NIRUX extras, for the Extras view: what each one is. Versions,
# installed state and selection come from `nirux extras list` at run time.
# From nirux docs/manual/12-extras.md.

[[extra]]
name = "nirunote"
description = "Minimal Markdown editor and viewer"
status = "beta"

[[extra]]
name = "nirupres"
description = "Presentation studio"
status = "beta"

[[extra]]
name = "nplay"
description = "Terminal music, radio and podcast player; also fully standalone"
status = "beta"

[[extra]]
name = "niruamp"
description = "Winamp-inspired graphical frontend for NPLAY (requires NPLAY)"
status = "alpha"

[[extra]]
name = "niruflow"
description = "Local maintenance and automation"
status = "alpha"

[[extra]]
name = "nirusec"
description = "Firewall, ports, updates, firmware and security overview"
status = "alpha"

[[extra]]
name = "nirugame"
description = "Steam games, ROMs from your folders and RetroArch, and native games, with box art and optional SID music"
status = "alpha"

[[extra]]
name = "niruremote"
description = "Graphical remote desktop over Tailscale and SSH"
status = "alpha"

[[extra]]
name = "nirudictate"
description = "Local speech-to-text dictation, voice commands, and voice messages to opencode"
status = "alpha"

[[extra]]
name = "docker-stacks"
description = "Docker Compose stacks, containers, images, volumes and networks in the terminal"
status = "beta"

[[extra]]
name = "niruprodrive"
description = "Proton Drive backups per computer, sending, fetching and links, with a tray cloud"
status = "alpha"

[[extra]]
name = "nirutoday"
description = "Today at a glance in a teletext look: SMHI weather, Sveriges Radio news, VMA, electricity price, name day and calendar"
status = "alpha"

[[extra]]
name = "nirusid"
description = "SID music player with HVSC lengths and STIL, raster bars and a chip view; the default player for .sid files"
status = "alpha"

[[extra]]
name = "nirusys"
description = "Retro system monitor: CPU, memory, disks, network, GPU, sensors, battery, processes and system panels with phosphor graphs, 24-hour history and alerts; full window, desktop widget or mini strip"
status = "alpha"
