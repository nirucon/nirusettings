# NIRUSETTINGS schema (format 1): NIRUBAR's own file.
# Written from nirubar src/weather.rs (settings), src/timer.rs (Settings),
# src/calendar.rs (apply_options) and src/popup_timeout.rs (MODULES,
# EXTRA_NAMES, MAX_SECONDS), NIRUBAR 0.34.2. These settings live in
# ~/.config/nirubar/config.toml, not in the shared NIRUWM file, so NIRUWM's
# strict check never sees them; NIRUBAR skips a bad entry and names it in
# `nirubar --check-config`, so the schema checks every value first.
format = 1
component = "nirubar"
name = "NIRUBAR"
file = "nirubar/config.toml"
new_file = "# NIRUBAR's own settings: weather, timer, calendar and panel timeouts.\n# Written by NIRUSETTINGS; see nirubar docs/CONFIGURATION.md.\n"
binary = "nirubar"
check = [["nirubar", "--check-config"]]
check_links = ["niruwm"]
apply = "reload"

[modes.reload]
run = ["niructl", "reload"]
says = "applied live (niructl reload)"
live = true

# ── Weather ────────────────────────────────────────────────────────────────

[[setting]]
key = "weather.location"
type = "string"
default = ""
section = "Bar"
group = "Weather (nirubar/config.toml)"
label = "Weather place name"
help = "The name the weather panel shows, such as Uddevalla. Any [weather] setting turns the weather on, with this file's place instead of the shared one."

[[setting]]
key = "weather.latitude"
type = "float"
min = -90.0
max = 90.0
step = 0.01
unit = "°"
default = 0.0
section = "Bar"
group = "Weather (nirubar/config.toml)"
label = "Weather latitude"
help = "Degrees, north positive (-90 to 90). Written with a decimal point: NIRUBAR ignores a whole number here."

[[setting]]
key = "weather.longitude"
type = "float"
min = -180.0
max = 180.0
step = 0.01
unit = "°"
default = 0.0
section = "Bar"
group = "Weather (nirubar/config.toml)"
label = "Weather longitude"
help = "Degrees, east positive (-180 to 180)."

[[setting]]
key = "weather.refresh_minutes"
type = "int"
min = 1
max = 1440
step = 5
unit = "min"
default = 30
section = "Bar"
group = "Weather (nirubar/config.toml)"
label = "Weather refresh"
help = "Minutes between two Open-Meteo requests (1 to 1440)."

# ── Timer ──────────────────────────────────────────────────────────────────

[[setting]]
key = "timer.minutes"
type = "int"
min = 1
max = 180
unit = "min"
default = 25
section = "Bar"
group = "Timer (nirubar/config.toml)"
label = "Timer length"
help = "What a reset focus timer starts with (1 to 180 minutes)."

[[setting]]
key = "timer.sound"
type = "bool"
default = true
section = "Bar"
group = "Timer (nirubar/config.toml)"
label = "Sound when the timer ends"
help = "A short sound when the timer reaches zero."

[[setting]]
key = "timer.dnd"
type = "bool"
default = false
section = "Bar"
group = "Timer (nirubar/config.toml)"
label = "Do Not Disturb while it runs"
help = "Pause notifications while the timer runs, and put them back afterwards."

# ── Calendar ───────────────────────────────────────────────────────────────

[[setting]]
key = "calendar.refresh_minutes"
type = "int"
min = 5
max = 1440
step = 5
unit = "min"
default = 15
section = "Bar"
group = "Calendar (nirubar/config.toml)"
label = "Calendar refresh"
help = "Minutes between two fetches of the calendar feeds (5 to 1440). The feeds themselves are in calendars.toml, mode 0600."

[[setting]]
key = "calendar.days_ahead"
type = "int"
min = 0
max = 31
unit = "days"
default = 7
section = "Bar"
group = "Calendar (nirubar/config.toml)"
label = "Agenda days ahead"
help = "How many days the clock's agenda lists (0 to 31)."

[[setting]]
key = "calendar.show_in_bar"
type = "bool"
default = false
section = "Bar"
group = "Calendar (nirubar/config.toml)"
label = "Next event in the bar"
help = "Show the next calendar event next to the clock."

