# NIRUSETTINGS schema (format 1): NIRUBAR, the bar.
# Written from nirubar src/config.rs (Bar, validate), src/editor.rs (the
# module catalogue) and docs/CONFIGURATION.md, checked against NIRUBAR
# 0.34.2. The [bar] table lives in the shared NIRUWM file; NIRUBAR refuses
# [bar] keys it does not know. The weather and sun location is at the top
# level of the same file, where NIRUWM accepts it too.
format = 1
component = "nirubar"
name = "NIRUBAR"
file = "niruwm/config.toml"
binary = "nirubar"
check = [["niruwm", "--check-config"], ["nirubar", "--check-config"]]
check_links = ["nirubar"]
apply = "reload"

[modes.reload]
run = ["niructl", "reload"]
says = "applied live (niructl reload)"
live = true

[modes.update]
says = "used by nirux update"
live = true

[[setting]]
key = "bar.enabled"
type = "bool"
default = true
section = "Bar"
group = "Bar"
label = "Show the bar"
help = "NIRUWM starts NIRUBAR on every screen. niructl bar hide|show toggles it for the session."

[[setting]]
key = "bar.position"
type = "enum"
choices = ["top", "bottom"]
default = "top"
section = "Bar"
group = "Bar"
label = "Screen edge"
help = "top or bottom. Super+Alt+B cycles top, bottom and hidden for the session."

[[setting]]
key = "bar_height"
type = "int"
min = 18
max = 100
unit = "px"
default = 28
section = "Bar"
group = "Bar"
label = "Height"
help = "Height of the bar in pixels (18 to 100). Windows are laid out below it."

[[setting]]
key = "bar.transparent"
type = "bool"
default = true
section = "Bar"
group = "Bar"
label = "See-through"
help = "The compositor (picom) blends the bar with the wallpaper. Without a compositor it stays opaque."

[[setting]]
key = "bar.opacity"
type = "int"
min = 1
max = 100
step = 2
unit = "%"
default = 94
section = "Bar"
group = "Bar"
label = "Opacity"
help = "How opaque a see-through bar is, in percent (1 to 100)."

[[setting]]
key = "bar.modules"
type = "list"
item = "enum"
unique = true
ordered = true
min_items = 1
choices = [
  { value = "workspaces", help = "Workspace cells; click to switch" },
  { value = "dictation", help = "NIRUDICTATE recording and transcribing mark" },
  { value = "privacy", help = "A dot while the microphone, a camera or a screen recording is in use" },
  { value = "recording", help = "NIRUCLIP recording timer" },
  { value = "scratchpad", help = "NIRUWM scratchpads" },
  { value = "layout", help = "The current NIRUWM layout" },
  { value = "media", help = "The playing track with a progress line" },
  { value = "volume", help = "Output volume and mute" },
  { value = "microphone", help = "Microphone mute and gain" },
  { value = "brightness", help = "Backlight; hidden without one" },
  { value = "display", help = "Where this screen sits among several" },
  { value = "tailscale", help = "Tailscale peers, when Tailscale is installed" },
  { value = "network", help = "Wired network" },
  { value = "wifi", help = "Wi-Fi connection" },
  { value = "bluetooth", help = "Bluetooth power and connected device; the panel connects and pairs devices" },
  { value = "powerprofile", help = "Active power profile" },
  { value = "mode", help = "Work mode countdown and studio mode" },
  { value = "battery", help = "Battery charge and state" },
  { value = "updates", help = "Available package updates" },
  { value = "niruxupdate", help = "A newer NIRUX release" },
  { value = "restart", help = "Programs to restart after a NIRUX update; hidden when none" },
  { value = "agent", help = "OpenCode prompt entry" },
  { value = "tasks", help = "NIRU and OpenCode task status" },
  { value = "nirusec", help = "NIRUSEC firewall state" },
  { value = "dnd", help = "Do Not Disturb" },
  { value = "notifications", help = "Notification history" },
  { value = "disk", help = "A warning when the disk is nearly full" },
  { value = "drives", help = "USB sticks and SD cards: open and eject; hidden without one" },
  { value = "timer", help = "Focus and egg timer; the panel has presets and typed minutes" },
  { value = "headset", help = "Battery of connected Bluetooth devices" },
  { value = "pulse", help = "CPU, memory and temperature; the panel opens NIRUSYS or a system monitor" },
  { value = "uptime", help = "Time since start" },
  { value = "sun", help = "Sunrise and sunset" },
  { value = "weather", help = "Weather with a rain timeline" },
  { value = "quicksettings", help = "Quick Settings" },
  { value = "share", help = "NIRUSHARE inbox" },
  { value = "clock", help = "Date and time" },
]
default = ["workspaces", "dictation", "privacy", "recording", "scratchpad", "layout", "media", "volume", "microphone", "headset", "brightness", "display", "tailscale", "network", "wifi", "bluetooth", "mode", "battery", "updates", "niruxupdate", "restart", "agent", "nirusec", "dnd", "timer", "disk", "drives", "quicksettings", "share", "clock"]
also_set = { "bar.follow_default_modules" = false }
section = "Bar"
group = "Modules"
label = "Modules and their order"
help = "What the bar shows, left to right. Your own list is kept by nirux update (follow default list turns off); reset returns to the NIRUX list."

[[setting]]
key = "bar.follow_default_modules"
type = "bool"
default = true
apply = "update"
section = "Bar"
group = "Modules"
label = "Follow the NIRUX list"
help = "nirux update keeps the modules on the NIRUX default list, so new modules arrive by themselves."

