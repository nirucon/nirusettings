[package]
name = "nirusettings"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A retro settings app for the NIRUX desktop"
license = "MIT"
repository = "https://github.com/nirucon/nirusettings"

[dependencies]
x11rb = { version = "0.13", features = ["shm"] }
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
